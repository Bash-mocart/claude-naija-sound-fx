name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Manifests are valid JSON
        run: for f in .claude-plugin/*.json hooks/hooks.json; do python3 -m json.tool "$f" >/dev/null && echo "ok $f"; done
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -S warning scripts/*.sh tests/run.sh
      - name: Tests
        run: tests/run.sh
